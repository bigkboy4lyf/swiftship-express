<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Applied synchronously, before CSS renders, so the page never
        // flashes the wrong theme on load.
        (function() {
            var stored = localStorage.getItem('theme');
            var theme = (stored === 'light' || stored === 'dark')
                ? stored
                : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | SwiftShip Express</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <i class="fas fa-shipping-fast"></i>
                <span>SwiftShip Express</span>
            </a>
            <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <section class="section" style="padding: 120px 0; text-align: center;">
        <div class="container">
            <h1 style="font-size: 4rem; color: var(--primary);">404</h1>
            <h2 style="margin-bottom: 20px;">Page Not Found</h2>
            <p style="margin-bottom: 30px;">The page you're looking for doesn't exist or has been moved.</p>
            <a href="index.html" class="btn">Go Home</a>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 SwiftShip Express</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
