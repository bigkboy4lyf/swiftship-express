<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Applied synchronously, before CSS renders, so the page never
        // flashes the wrong theme on load.
        (function() {
            var stored = localStorage.getItem('theme');
            var theme = (stored === 'light' || stored === 'dark')
                ? stored
                : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftShip Express | Pay Invoice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Header & Navigation -->
    <header id="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <i class="fas fa-shipping-fast"></i>
                <span>SwiftShip Express</span>
            </a>

            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>

           <ul class="nav-links" id="navLinks">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#tracking">Tracking</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li>
                    <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
                        <i class="fas fa-moon"></i>
                    </button>
                </li>
                <li id="signInItem"><a href="account.html">Sign In</a></li>
                <li><a href="dashboard.html" class="btn">Dashboard</a></li>
            </ul>
        </div>
    </header>

    <section class="section" style="padding: 120px 0 60px; min-height: 100vh; display: flex; align-items: flex-start;">
        <div class="container">
            <div style="max-width: 460px; margin: 0 auto; background: var(--surface); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 40px;">

                <!-- Card entry state -->
                <div id="payFormState">
                    <div style="text-align: center; margin-bottom: 25px;">
                        <div class="logo" style="justify-content: center; font-size: 1.6rem; margin-bottom: 10px;">
                            <i class="fas fa-lock"></i>
                            <span>Secure Payment</span>
                        </div>
                        <p style="color: var(--gray);">Pay your SwiftShip Express invoice by card</p>
                    </div>

                    <div style="background: var(--surface-alt); border-radius: 8px; padding: 16px 18px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <span style="display:block; font-size: 0.8rem; color: var(--gray);">Tracking Number</span>
                            <strong id="payTrackingNumber">&mdash;</strong>
                        </div>
                        <div style="text-align: right;">
                            <span style="display:block; font-size: 0.8rem; color: var(--gray);">Amount Due</span>
                            <strong id="payAmountDue" style="color: var(--primary); font-size: 1.2rem;">$0.00</strong>
                        </div>
                    </div>

                    <div id="payAlert" class="alert"></div>

                    <form id="payForm">
                        <div style="margin-bottom: 18px;">
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Cardholder Name</label>
                            <input type="text" id="cardName" placeholder="Name as shown on card" required autocomplete="cc-name" style="width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 5px; font-size: 1rem; background: var(--surface); color: var(--text);">
                        </div>

                        <div style="margin-bottom: 18px;">
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Card Number</label>
                            <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" inputmode="numeric" autocomplete="cc-number" maxlength="19" required style="width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 5px; font-size: 1rem; background: var(--surface); color: var(--text);">
                        </div>

                        <div style="display: flex; gap: 15px; margin-bottom: 18px;">
                            <div style="flex: 1;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Expiry</label>
                                <input type="text" id="cardExpiry" placeholder="MM/YY" inputmode="numeric" autocomplete="cc-exp" maxlength="5" required style="width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 5px; font-size: 1rem; background: var(--surface); color: var(--text);">
                            </div>
                            <div style="flex: 1;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">CVV</label>
                                <input type="text" id="cardCvv" placeholder="123" inputmode="numeric" autocomplete="cc-csc" maxlength="4" required style="width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 5px; font-size: 1rem; background: var(--surface); color: var(--text);">
                            </div>
                        </div>

                        <div style="margin-bottom: 24px;">
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Billing Postal Code</label>
                            <input type="text" id="cardZip" placeholder="Postal / ZIP code" autocomplete="postal-code" required style="width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 5px; font-size: 1rem; background: var(--surface); color: var(--text);">
                        </div>

                        <button type="submit" class="btn" id="paySubmitBtn" style="width: 100%; padding: 14px; font-size: 1.1rem;"><i class="fas fa-lock"></i> Pay <span id="paySubmitAmount"></span></button>
                    </form>

                    <p style="text-align: center; color: var(--gray); font-size: 0.8rem; margin-top: 20px;">
                        <i class="fas fa-shield-alt"></i> Your card details stay in your browser and are never stored by SwiftShip Express.
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
    <script src="js/auth-navbar.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const tracking = params.get('tracking') || 'N/A';
        const shipmentId = params.get('shipment') || '';
        const amount = parseFloat(params.get('amount'));
        const amountText = isNaN(amount) ? '$0.00' : `$${amount.toFixed(2)}`;

        document.getElementById('payTrackingNumber').textContent = tracking;
        document.getElementById('payAmountDue').textContent = amountText;
        document.getElementById('paySubmitAmount').textContent = isNaN(amount) ? '' : amountText;

        // Light formatting only -- purely cosmetic, nothing here is ever sent
        // anywhere. There's no payment processor wired up yet (see submit
        // handler below), so no card data needs to leave the browser at all.
        document.getElementById('cardNumber')?.addEventListener('input', function(e) {
            let digits = e.target.value.replace(/\D/g, '').slice(0, 16);
            e.target.value = digits.replace(/(.{4})/g, '$1 ').trim();
        });
        document.getElementById('cardExpiry')?.addEventListener('input', function(e) {
            let digits = e.target.value.replace(/\D/g, '').slice(0, 4);
            e.target.value = digits.length > 2 ? `${digits.slice(0, 2)}/${digits.slice(2)}` : digits;
        });
        document.getElementById('cardCvv')?.addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
        });

        // Card processing isn't wired up yet -- this simply hands off to the
        // same receipt-upload step the bank transfer flow ends at (see
        // dashboard-ui.js's "I've Made This Payment" button), so both
        // payment methods converge on one place for admin to review. No
        // card fields are read from the form or sent anywhere; swap this
        // handler out once a real processor is integrated.
        document.getElementById('payForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('paySubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            setTimeout(() => {
                const receiptParams = new URLSearchParams({ shipment: shipmentId, tracking, method: 'card' });
                window.location.href = `submit-receipt.html?${receiptParams.toString()}`;
            }, 900);
        });
    </script>
</body>
</html>
